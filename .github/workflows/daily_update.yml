# .github/workflows/daily_update.yml
name: Daily update

on:
  # schedule:
  #   # Mon-Fri. Yuanta publishes the final daily bar some time after the 15:00 close, so try three times;
  #   # every run is idempotent and commits nothing when there is no new data.
  #   - cron: "0 9 * * 1-5"      # 16:00 Vietnam time
  #   - cron: "30 10 * * 1-5"    # 17:30 Vietnam time
  #   - cron: "0 13 * * 1-5"     # 20:00 Vietnam time (catch-up)
  workflow_dispatch:

concurrency:
  group: market-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Probe Yuanta API from this runner (diagnostic)
        continue-on-error: true
        run: python -m backend.probe
      - name: Collect (universe + incremental OHLCV)
        id: collect
        run: |
          set +e
          python -m backend.collect_data
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = ok, 1 = partial failures (keep going and commit what worked), 2+ = fatal: stop now
          if [ "$rc" -ge 2 ]; then exit "$rc"; fi
          exit 0
      - run: python -m backend.calculate_indicators
      - run: python -m backend.calculate_breadth
      - run: python -m backend.calculate_valuation   # no-op until data/fundamentals exists
      - run: python -m backend.validate_data
      - run: python -m backend.history_coverage   # actual start year of prices, statements and valuation
      - run: python -m backend.era_compare        # before / after 2020 comparison with generated highlights
      - name: Report latest trading date
        run: python -c "import json;s=json.load(open('data/monitor/status.json'));print('::notice::latest_trading_date =', s['latest_trading_date'], '| updated symbols =', s['collect']['updated'])"
      - name: Commit and push (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No data changes - nothing to commit"; exit 0; fi
          git commit -m "data: update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
      - name: Fail the run if some symbols failed
        if: steps.collect.outputs.rc == '1'
        run: |
          echo "::error::Partial collection failure - see data/monitor/status.json (failures) and the Collect log"
          exit 1
