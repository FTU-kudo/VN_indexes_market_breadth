# .github/workflows/check_frontend.yml
name: Check frontend

on:
  workflow_dispatch:
  push:
    paths: ["frontend/**", "tools/**", "data/fundamentals/**", "data/valuation/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Required files, imports and file locations
        run: python tools/check_frontend.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install website dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Test the browser P/E and P/B maths
        working-directory: frontend
        run: |
          npx tsc lib/valuation.ts --outDir /tmp/tsout --target ES2020 --module commonjs --skipLibCheck
          node ../tools/test_frontend_logic.mjs
      - name: Build the site exactly as Vercel does (shows the real error if it fails)
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build
      - name: Check the data the website reads (dates, TTM profit, P/E, P/B)
        run: python tools/check_data.py
