name: Manual backfill

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download full history from 2020-01-01"
        type: boolean
        default: true
      symbols:
        description: "Optional comma-separated subset, e.g. VIC,VHM,VNINDEX (empty = everything)"
        type: string
        default: ""

concurrency:
  group: market-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Yuanta API from this runner (diagnostic)
        continue-on-error: true
        run: python -m backend.probe
      - name: Collect (universe + incremental OHLCV)
        id: collect
        env:
          FULL: ${{ inputs.full }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          ARGS=""
          [ "$FULL" = "true" ] && ARGS="$ARGS --full"
          [ -n "$SYMBOLS" ] && ARGS="$ARGS --symbols $SYMBOLS"
          set +e
          python -m backend.collect_data $ARGS
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = ok, 1 = partial failures (keep going and commit what worked), 2+ = fatal: stop now
          if [ "$rc" -ge 2 ]; then exit "$rc"; fi
          exit 0
      - run: python -m backend.calculate_indicators
      - run: python -m backend.calculate_breadth
      - run: python -m backend.validate_data
      - name: Commit and push 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No data changes - nothing to commit"; exit 0; fi
          git commit -m "data: backfill $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
      - name: Fail the run if some symbols failed
        if: steps.collect.outputs.rc == '1'
        run: |
          echo "::error::Partial collection failure - see data/monitor/status.json (failures) and the Collect log"
          exit 1
